<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Csay 编辑器</title>
<link rel="stylesheet" href="/codemirror/codemirror.css">
<link rel="stylesheet" href="/codemirror/show-hint.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: #424242 #1e1e1e; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #1e1e1e; }
  ::-webkit-scrollbar-thumb { background: #424242; border: 2px solid #1e1e1e; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #4f4f4f; }
  ::-webkit-scrollbar-corner { background: #1e1e1e; }
  html, body { height: 100%; background: #1e1e1e; color: #d4d4d4; font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button { font-family: inherit; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 14px; background: #252526; border-bottom: 1px solid #333; min-height: 46px; }
  .logo { color: #4ec9b0; font-weight: bold; letter-spacing: 1px; }
  #fileTitle { color: #9cdcfe; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .spacer { flex: 1; }
  header button, .modal-actions button {
    background: #333; color: #ddd; border: 1px solid #444; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  header button:hover, .modal-actions button:hover { background: #3f3f46; }
  header button.primary { background: #0e639c; border-color: #0e639c; color: #fff; }
  header button.primary:hover { background: #1177bb; }
  #status { font-size: 12px; color: #858585; margin-left: 4px; white-space: nowrap; }
  #status.err { color: #f48771; } #status.ok { color: #4ec9b0; }
  #tabs { height: 34px; display: flex; background: #252526; border-bottom: 1px solid #333; overflow-x: auto; overflow-y: hidden; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 10px; color: #9a9a9a; border-right: 1px solid #333; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #0e639c; }
  .tab .dirty { color: #d7ba7d; }
  .tab .close { color: #858585; padding: 0 2px; }
  .tab .close:hover { color: #f48771; }
  #body { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 250px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; min-width: 160px; }
  #sideTop { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-bottom: 1px solid #333; font-size: 13px; color: #4ec9b0; }
  #folderTitle { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #filter { margin: 7px 8px; background: #1e1e1e; border: 1px solid #3c3c3c; color: #ddd; padding: 4px 8px; font-size: 12px; }
  #tree { flex: 1; overflow: auto; padding: 2px 0 8px; font-size: 13px; user-select: none; }
  .tree-dir { padding-left: 6px; }
  .tree-dir > summary { padding: 2px 4px; color: #dcdcaa; cursor: pointer; list-style: none; white-space: nowrap; }
  .tree-dir > summary::-webkit-details-marker { display: none; }
  .tree-dir > summary::before { content: "▸"; display: inline-block; width: 14px; color: #858585; }
  .tree-dir[open] > summary::before { content: "▾"; }
  .tree-file { padding: 3px 4px 3px 20px; color: #9cdcfe; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree-file:hover, .tree-dir > summary:hover { background: #2a2d2e; }
  .tree-file.selected, .tree-dir.selected > summary { background: #094771; color: #fff; }
  .tree-empty { padding: 10px; color: #858585; font-size: 12px; line-height: 1.6; }
  #editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main { flex: 1; min-height: 0; position: relative; }
  #cmhost { position: absolute; inset: 0; }
  #welcome { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: #1e1e1e; }
  #welcome.hidden { display: none; }
  .welcome-box { text-align: center; color: #858585; line-height: 1.9; }
  .welcome-box h2 { color: #4ec9b0; font-size: 20px; margin-bottom: 8px; }
  .welcome-box p { font-size: 13px; }
  .welcome-box .muted { color: #58636e; font-size: 12px; margin-top: 8px; }
  .CodeMirror { height: 100%; font: 14px/20px "Cascadia Code", Consolas, "Microsoft YaHei", monospace; background: #1e1e1e; color: #d4d4d4; }
  .CodeMirror-gutters { background: #1e1e1e; border-right: 1px solid #333; }
  .CodeMirror-linenumber { color: #6e7681; padding: 0 8px 0 8px; }
  .CodeMirror-cursor { border-left: 2px solid #aeafad; }
  .CodeMirror-selected { background: #264f78 !important; }
  .CodeMirror-focused .CodeMirror-selected { background: #264f78 !important; }
  .cm-s-csay .cm-comment { color: #6a9955; font-style: italic; }
  .cm-s-csay .cm-string { color: #ce9178; }
  .cm-s-csay .cm-number { color: #b5cea8; }
  .cm-s-csay .cm-type { color: #4ec9b0; }
  .cm-s-csay .cm-def { color: #4ec9b0; }
  .cm-s-csay .cm-modifier { color: #c586c0; }
  .cm-s-csay .cm-keyword { color: #c586c0; }
  .cm-s-csay .cm-atom { color: #569cd6; }
  .cm-s-csay .cm-variable { color: #9cdcfe; }
  .CodeMirror-hints { background: #252526; border: 1px solid #454545; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.55); font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace; font-size: 13px; padding: 3px; }
  .CodeMirror-hint { color: #d4d4d4; padding: 4px 8px; border-radius: 3px; }
  li.CodeMirror-hint-active { background: #094771; color: #fff; }
  #panel { height: 170px; overflow: auto; border-top: 1px solid #333; font-size: 13px; flex: none; }
  .tabbar { display: flex; background: #252526; position: sticky; top: 0; z-index: 3; }
  .tabbar div { padding: 5px 16px; cursor: pointer; color: #858585; }
  .tabbar div.on { color: #fff; background: #1e1e1e; border-top: 2px solid #0e639c; }
  #problems, #output, #refs { padding: 6px 14px; display: none; white-space: pre-wrap; }
  #problems.show, #output.show, #refs.show { display: block; }
  .prob { padding: 2px 0; cursor: pointer; }
  .prob:hover { background: #2a2d2e; }
  .prob .sev { color: #f48771; margin-right: 6px; }
  .prob .sev.warn { color: #cca700; }
  .prob .hint { color: #6a9955; margin-left: 10px; }
  #output { color: #ce9178; }
  #output.ok { color: #d4d4d4; }
  #output .errline { color: #f48771; }
  #statusbar { height: 24px; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: #007acc; color: #fff; font-size: 12px; flex: none; }
  #hint { margin-left: auto; opacity: .85; }
  #modal, #projectModal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
  #modal.hidden, #projectModal.hidden { display: none; }
  .modal-box { width: min(480px, 92vw); background: #252526; border: 1px solid #3c3c3c; box-shadow: 0 10px 40px rgba(0,0,0,.6); padding: 18px; }
  .modal-box h3 { color: #4ec9b0; font-size: 16px; margin-bottom: 10px; }
  .modal-box p { color: #c8c8c8; font-size: 13px; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; word-break: break-all; }
  .modal-box input { width: 100%; background: #1e1e1e; border: 1px solid #3c3c3c; color: #ddd; padding: 7px 9px; font-size: 13px; margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-actions .ok { background: #0e639c; border-color: #0e639c; color: #fff; }
  .ctxmenu { position: fixed; z-index: 30; min-width: 248px; background: #252526; border: 1px solid #555; box-shadow: 0 8px 28px rgba(0,0,0,.65); padding: 6px 0; }
  .ctxmenu.hidden { display: none; }
  .ctxmenu button { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 100%; text-align: left; background: transparent; border: 0; color: #ddd; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .ctxmenu button:hover, .ctxmenu button:focus { background: #094771; color: #fff; outline: none; }
  .ctxmenu button .key { color: #8a8a8a; font-size: 11px; font-family: Consolas, monospace; }
  .ctxmenu button:hover .key, .ctxmenu button:focus .key { color: #c8dff0; }
  .ctxmenu .sep { height: 1px; background: #3c3c3c; margin: 5px 0; }
  .ctxmenu .danger { color: #f48771; }
  .projectbar { margin: 7px 10px 0; padding: 7px 9px; background: #2a2d2e; border: 1px solid #3c3c3c; color: #cfcfcf; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .projectbar:hover { border-color: #0e639c; color: #fff; }
  .proj-form { display: grid; grid-template-columns: 88px 1fr; gap: 9px 10px; align-items: center; margin: 12px 0 4px; }
  .proj-form label { color: #cfcfcf; font-size: 13px; }
  .proj-form input { width: 100%; box-sizing: border-box; margin-bottom: 0; }
  .proj-pick { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .proj-pick input { flex: 1; min-width: 0; }
  .proj-pick button { flex: none; padding: 6px 10px; }
  .proj-note { color: #8a8a8a; font-size: 12px; margin: 2px 0 10px; }
  .proj-error { color: #f48771; min-height: 18px; font-size: 12px; }
  @media (max-width: 760px) { #sidebar { width: 180px; } #hint { display: none; } }
</style>
</head>
<body>
<header>
  <span class="logo">Csay</span>
  <span id="fileTitle">未打开文件</span>
  <span class="spacer"></span>
  <button id="btnSave">保存</button>
  <button id="btnRun" class="primary">▶ 运行</button>
  <button id="btnProject">项目</button>
  <button id="btnPackage">打包</button>
  <button id="btnDocs">文档</button>
  <span id="status">就绪</span>
</header>

<nav id="tabs"></nav>

<div id="body">
  <aside id="sidebar">
    <div id="sideTop">
      <span id="folderTitle">工作区</span>
    </div>
    <div id="projectInfo" class="projectbar" title="点击编辑项目">未配置项目</div>
    <input id="filter" placeholder="筛选 .csay / .csayproj">
    <div id="tree"></div>
  </aside>

  <section id="editor">
    <div id="main">
      <div id="cmhost"></div>
      <div id="welcome">
        <div class="welcome-box">
          <h2>Csay 编辑器</h2>
          <p>从左侧文件树打开文件，或在空白处右键新建文件。</p>
          <p class="muted">Ctrl+N 新建文件 · Ctrl+O 打开文件夹 · F1 查看教程</p>
        </div>
      </div>
    </div>
    <div id="panel">
      <div class="tabbar">
        <div id="tab-p" class="on">问题</div>
        <div id="tab-o">输出</div>
        <div id="tab-r">引用</div>
      </div>
      <div id="problems" class="show"></div>
      <div id="output"></div>
      <div id="refs"></div>
    </div>
  </section>
</div>

<footer id="statusbar">
  <span id="pos">行 1，列 1</span>
  <span id="hint">Ctrl+S 保存 · Ctrl+Enter 运行 · F12 定义 · Shift+F12 引用 · Ctrl+N 新建</span>
</footer>

<div id="ctxmenu" class="ctxmenu hidden"></div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h3 id="modalTitle">提示</h3>
    <p id="modalMsg"></p>
    <input id="modalInput">
    <div class="modal-actions">
      <button id="modalCancel">取消</button>
      <button id="modalOk" class="ok">确定</button>
    </div>
  </div>
</div>

<div id="projectModal" class="hidden">
  <div class="modal-box">
    <h3>项目设置</h3>
    <div class="proj-form">
      <label for="projName">项目名称</label>
      <input id="projName" placeholder="我的项目">
      <label for="projEntry">入口文件</label>
      <div class="proj-pick">
        <input id="projEntry" placeholder="选择主文件">
        <button id="projPick" type="button">选择…</button>
      </div>
      <label for="projOutput">输出文件名</label>
      <input id="projOutput" placeholder="程序">
      <label for="projVersion">版本号</label>
      <input id="projVersion" placeholder="0.1.0">
    </div>
    <p class="proj-note">入口相对项目目录；输出不含 .exe。</p>
    <div id="projError" class="proj-error"></div>
    <div class="modal-actions">
      <button id="projCancel">取消</button>
      <button id="projSave" class="ok">保存项目</button>
    </div>
  </div>
</div>

<script src="/codemirror/codemirror.js"></script>
<script src="/codemirror/show-hint.js"></script>
<script src="/codemirror/comment.js"></script>
<script>
var cmhost = document.getElementById('cmhost');
var tabsEl = document.getElementById('tabs');
var treeEl = document.getElementById('tree');
var fileTitle = document.getElementById('fileTitle');
var folderTitle = document.getElementById('folderTitle');
var statusEl = document.getElementById('status');
var welcome = document.getElementById('welcome');
var modal = document.getElementById('modal');
var modalTitle = document.getElementById('modalTitle');
var modalMsg = document.getElementById('modalMsg');
var modalInput = document.getElementById('modalInput');
var projectModal = document.getElementById('projectModal');
var ctxmenu = document.getElementById('ctxmenu');

var TABS = [];
var ACTIVE = -1;
var FILE = '';
var WORKSPACE = '';
var TREE_ROOT = '';
var TREE = null;
var SELECTED = null;
var FILTER = '';
var PROJECT = null;
var PROJECT_PATH = '';
var PROJECT_EXISTS = false;
var LAST_PROJECT_ERROR = '';
var modalResolve = null;
var modalInputMode = false;
var loading = false;
var checkTimer = null;

CodeMirror.defineMode('csay', function () {
  var types = { '整数': 1, '小数': 1, '文本': 1, '真假': 1, '无': 1, '列表': 1, '表': 1 };
  var decls = { '类': 1, '结构': 1, '接口': 1, '枚举': 1 };
  var mods = { '公开': 1, '私有': 1, '保护': 1, '内部': 1, '静态': 1, '虚拟': 1, '覆盖': 1 };
  var ctl = { '若': 1, '否则若': 1, '否则': 1, '择': 1, '情形': 1, '默认': 1, '对于': 1, '遍历': 1, '只要': 1, '做': 1, '在': 1, '返回': 1, '跳出': 1, '跳过': 1, '区域': 1, '使用': 1, '试': 1, '捕获': 1, '最终': 1, '抛出': 1 };
  var atoms = { '新': 1, '空': 1, '真': 1, '假': 1, '自': 1, '基': 1, '取': 1, '写': 1 };
  return {
    token: function (stream) {
      if (stream.eatSpace()) return null;
      if (stream.match('//')) { stream.skipToEnd(); return 'comment'; }
      if (stream.match(/\$?"(?:\\.|[^"\\])*"/)) return 'string';
      if (stream.match(/\d+(?:\.\d+)?/)) return 'number';
      var word = stream.match(/[A-Za-z_\u4e00-\u9fa5][\w\u4e00-\u9fa5]*/);
      if (word) {
        if (types[word]) return 'type';
        if (decls[word]) return 'def';
        if (mods[word]) return 'modifier';
        if (ctl[word]) return 'keyword';
        if (atoms[word]) return 'atom';
        return 'variable';
      }
      stream.next();
      return null;
    }
  };
});

var cm = CodeMirror(cmhost, {
  value: '',
  mode: 'csay',
  lineNumbers: true,
  lineWrapping: false,
  indentUnit: 4,
  tabSize: 4,
  indentWithTabs: false,
  smartIndent: true,
  viewportMargin: 10,
  theme: 'csay'
});

var HINT_WORDS = [
  '整数', '小数', '文本', '真假', '无', '列表', '集合', '队列', '栈', '表', '条目', '异常',
  '参数异常', '状态异常', '文件异常', '越界异常', '格式异常',
  '类', '结构', '接口', '枚举', '委托',
  '公开', '私有', '保护', '内部', '静态', '虚拟', '覆盖', '密封', '抽象', '只读', '常',
  '若', '否则若', '否则', '择', '情形', '默认',
  '对于', '遍历', '只要', '做', '在', '返回', '跳出', '跳过',
  '区域', '使用', '试', '捕获', '最终', '抛出',
  '新', '空', '真', '假', '自', '基', '取', '写', '断言',
  '打印', '输入', '询问', '读文件', '写文件', '文本长度', '转大写', '转小写', '去除空白',
  '重复文本', '连接文本', '格式化小数', '格式化', '填充文本', '查找文本', '正则匹配', '正则查找', '正则替换', 'JSON文本', 'JSON序列化', 'JSON解析',
  '转整数', '转小数', '取整', '开方', '绝对值', '退出', '命令行参数',
  '正弦', '余弦', '正切', '反正弦', '反余弦', '反正切', '反正切2',
  '自然对数', '常用对数', '指数', '幂', '向下取整', '向上取整', '截断',
  '符号', '最大', '最小', '圆周率', '随机', '随机整数', '随机种子',
  '当前时间', '当前日期', '时间戳', '格式化时间', '当前目录', '路径合并',
  '路径存在', '目录列表', '创建目录', '删除文件', '删除目录', '是目录', '是文件', '文件大小',
  '读环境变量', '系统平台', '运行命令', '运行命令输出',
  '打开文件', '读文件行', '写文件行', '文件末尾', '关闭文件'
];
var HINT_METHODS = [
  '追加', '插入', '删除', '清空', '查找', '排序', '反转', '去重', '切片', '最大', '数量',
  '集合添加', '入队', '出队', '入栈', '出栈',
  '长度', '含', '取值', '设置', '条目', '切分', '切分空白', '替换', '转整数', '转小数',
  '转大写', '转小写', '去除空白'
];

function uniquePush(out, seen, word) {
  if (!word || seen[word]) return;
  seen[word] = true;
  out.push(word);
}

// 轻量类型感知：扫源文件里的 类/结构/接口 声明和局部变量声明。
// 只求给编辑器一个有用的候选集，不替代编译器的语义检查。
function scanTypes(text) {
  var types = {};
  var re = /(?:类|结构|接口)\s+([A-Za-z_\u4e00-\u9fa5][\w\u4e00-\u9fa5]*)/g;
  var m;
  while ((m = re.exec(text))) {
    var name = m[1];
    var open = text.indexOf('{', re.lastIndex);
    if (open < 0) break;
    var depth = 0, close = -1;
    for (var i = open; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch === '{') depth++;
      else if (ch === '}') {
        depth--;
        if (depth === 0) { close = i; break; }
      }
    }
    if (close < 0) break;
    var body = text.slice(open + 1, close);
    var members = [];
    var memberDepth = 0;
    var lines = body.split('\n');
    for (var li = 0; li < lines.length; li++) {
      var lineText = lines[li];
      if (memberDepth === 0) {
        var memberRe = /^\s*(?:(?:公开|私有|保护|内部|静态|虚拟|覆盖|抽象|只读|常)\s+)*([A-Za-z_\u4e00-\u9fa5][\w\u4e00-\u9fa5<>,\[\]:]*)\s+([A-Za-z_\u4e00-\u9fa5][\w\u4e00-\u9fa5]*)\s*(?:\(|;|=|\{)/;
        var mm = memberRe.exec(lineText);
        if (mm && members.indexOf(mm[2]) < 0) members.push(mm[2]);
      }
      for (var ci = 0; ci < lineText.length; ci++) {
        var ch = lineText.charAt(ci);
        if (ch === '/' && lineText.charAt(ci + 1) === '/') break;
        if (ch === '"' || ch === "'") {
          var quote = ch;
          ci++;
          while (ci < lineText.length && lineText.charAt(ci) !== quote) {
            if (lineText.charAt(ci) === '\\') ci++;
            ci++;
          }
          continue;
        }
        if (ch === '{') memberDepth++;
        else if (ch === '}') memberDepth--;
      }
    }
    types[name] = members;
    re.lastIndex = close + 1;
  }
  return types;
}

function receiverMembers(text, receiver) {
  if (!receiver) return null;
  var types = scanTypes(text);
  if (types[receiver]) return types[receiver];
  var vars = {};
  var varRe = /(?:^|\n)\s*([A-Za-z_\u4e00-\u9fa5][\w\u4e00-\u9fa5<>,\[\]:]*)\s+([A-Za-z_\u4e00-\u9fa5][\w\u4e00-\u9fa5]*)\s*(?:=|;)/g;
  var m;
  while ((m = varRe.exec(text))) {
    if (types[m[1]]) vars[m[2]] = m[1];
  }
  return types[vars[receiver]] || null;
}

function csayHint(editor) {
  var cur = editor.getCursor();
  var line = editor.getLine(cur.line);
  var end = cur.ch;
  var start = end;
  while (start > 0 && /[\w\u4e00-\u9fa5]/.test(line.charAt(start - 1))) start--;
  var word = line.slice(start, end);
  var dot = start > 0 && line.charAt(start - 1) === '.';
  var pool = [];
  var seen = {};

  if (dot) {
    var recvEnd = start - 1;
    var recvStart = recvEnd;
    while (recvStart > 0 && /[\w\u4e00-\u9fa5]/.test(line.charAt(recvStart - 1))) recvStart--;
    var typedMembers = receiverMembers(editor.getValue(), line.slice(recvStart, recvEnd));
    if (typedMembers) {
      for (var t = 0; t < typedMembers.length; t++) uniquePush(pool, seen, typedMembers[t]);
    }
    for (var m = 0; m < HINT_METHODS.length; m++) uniquePush(pool, seen, HINT_METHODS[m]);
  } else {
    for (var k = 0; k < HINT_WORDS.length; k++) uniquePush(pool, seen, HINT_WORDS[k]);
    var text = editor.getValue();
    var words = text.match(/[A-Za-z_\u4e00-\u9fa5][\w\u4e00-\u9fa5]*/g) || [];
    for (var w = 0; w < words.length && w < 2000; w++) uniquePush(pool, seen, words[w]);
  }

  var list = [];
  for (var i = 0; i < pool.length; i++) {
    if (pool[i] === word) continue;
    if (word && pool[i].indexOf(word) !== 0) continue;
    list.push(pool[i]);
    if (list.length >= 40) break;
  }
  if (!list.length) return null;
  return {
    list: list,
    from: CodeMirror.Pos(cur.line, start),
    to: CodeMirror.Pos(cur.line, end)
  };
}

function showCsayHint(editor) {

function esc(s) {

function renderTabs() {

function capture() {

function selectTreePath(path) {

function showProblems(diags) {

function renderTree() {
  treeEl.innerHTML = '';
  if (!TREE) return;
  function visible(node) {
    if (!FILTER) return true;
    var q = FILTER.toLowerCase();
    if (node.name.toLowerCase().indexOf(q) >= 0) return true;
    if (node.dir && node.children) {
      for (var i = 0; i < node.children.length; i++) if (visible(node.children[i])) return true;
    }
    return false;
  }
  function add(node, box, depth) {
    if (!visible(node)) return;
    if (node.dir) {
      var details = document.createElement('details');
      details.className = 'tree-dir';
      details.open = depth < 2 || FILTER !== '';
      details.dataset.path = node.path;
      var summary = document.createElement('summary');
      summary.textContent = node.name;
      summary.addEventListener('click', function () { selectNode({ path: node.path, dir: true, name: node.name }); });
      details.addEventListener('contextmenu', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        var info = { path: node.path, dir: true, name: node.name };
        selectNode(info);
        showMenu(ev.clientX, ev.clientY, nodeMenu(info));
      });
      details.appendChild(summary);
      var kids = document.createElement('div');
      for (var i = 0; i < node.children.length; i++) add(node.children[i], kids, depth + 1);
      details.appendChild(kids);
      box.appendChild(details);
    } else {
      var row = document.createElement('div');
      row.className = 'tree-file';
      row.dataset.path = node.path;
      row.textContent = node.name;
      row.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var info = { path: node.path, dir: false, name: node.name };
        selectNode(info);
        openPath(node.path);
      });
      row.addEventListener('contextmenu', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        var info = { path: node.path, dir: false, name: node.name };
        selectNode(info);
        showMenu(ev.clientX, ev.clientY, nodeMenu(info));
      });
      box.appendChild(row);
    }
  }
  for (var i = 0; i < TREE.entries.length; i++) add(TREE.entries[i], treeEl, 0);
  if (!treeEl.children.length) {
    var empty = document.createElement('div');
    empty.className = 'tree-empty';
    empty.textContent = FILTER ? '没有匹配的 .csay 文件' : '这个文件夹里还没有 .csay 文件';
    treeEl.appendChild(empty);
  }
  selectNode(SELECTED);
}
function selectNode(node) {

  for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
  if (!node) return;
  var rows = treeEl.querySelectorAll('[data-path]');
  for (var j = 0; j < rows.length; j++) {
    if (rows[j].dataset.path === node.path) rows[j].classList.add('selected');
  }

function newFile(dir) {
  dir = dir || targetDir();
  askText('新建文件', '在 ' + dir + ' 中新建 .csay 文件：', '新程序.csay').then(function (name) {
    if (!name) return;
    fetch('/api/new', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dir: dir, name: name, kind: 'file' }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { setStatus(d.error, 'err'); return; }
        loadTree(TREE_ROOT);
        openPath(d.path);
      });
  });
}
function newFolder(dir) {
  dir = dir || targetDir();
  askText('新建文件夹', '在 ' + dir + ' 中新建文件夹：', '新文件夹').then(function (name) {
    if (!name) return;
    fetch('/api/new', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dir: dir, name: name, kind: 'dir' }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { setStatus(d.error, 'err'); return; }
        loadTree(TREE_ROOT);
      });
  });
}
function deleteNode(node) {
  var target = node || SELECTED;
  if (!target && current()) target = { path: current().path, dir: false, name: current().name };
  if (!target) { setStatus('先选择文件或文件夹', 'err'); return; }
  askConfirm('删除', '确定删除「' + target.name + '」？\n' + target.path + (target.dir ? '\n文件夹会连同内容一起删除。' : '')).then(function (ok) {
    if (!ok) return;
    fetch('/api/delete', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ path: target.path, root: TREE_ROOT }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { setStatus(d.error, 'err'); return; }
        removeTabsUnder(target.path);
        SELECTED = null;
        loadTree(TREE_ROOT);
        setStatus('已删除', 'ok');
      });
  });
}
function removeTabsUnder(path) {
  var activePath = current() ? current().path : '';
  var kept = [];
  for (var i = 0; i < TABS.length; i++) if (!under(TABS[i].path, path)) kept.push(TABS[i]);
  TABS = kept;
  if (TABS.length === 0) { clearEditor(); return; }
  var idx = 0;
  for (var j = 0; j < TABS.length; j++) if (TABS[j].path === activePath) idx = j;
  activate(idx);
}
function renameNode(node) {
  if (!node) return;
  askText('重命名', '新名称：', node.name).then(function (name) {
    if (!name || name === node.name) return;
    fetch('/api/rename', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ path: node.path, name: name }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { setStatus(d.error, 'err'); return; }
        for (var i = 0; i < TABS.length; i++) {
          if (under(TABS[i].path, node.path)) {
            TABS[i].path = d.path + TABS[i].path.slice(node.path.length);
            TABS[i].name = baseName(TABS[i].path);
          }
        }
        if (current()) FILE = current().path;
        renderTabs(); updateTitle();
        SELECTED = null;
        loadTree(TREE_ROOT);
        setStatus('已重命名', 'ok');
      });
  });
}
function copyPath(node) {
  var text = node ? node.path : (current() ? current().path : '');
  if (!text) return;
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text);
  setStatus('已复制路径', 'ok');
}
function revealNode(node) {
  var target = node || (current() ? { path: current().path } : null);
  if (!target) return;
  fetch('/api/reveal', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ path: target.path }) });
}
function menuItem(label, action, danger, key) { return { label: label, action: action, danger: danger, key: key || '' }; }
function menuSep() { return { sep: true }; }
function hideMenu() { ctxmenu.classList.add('hidden'); }
function showMenu(x, y, items) {
  ctxmenu.innerHTML = '';
  for (var i = 0; i < items.length; i++) {
    (function (item) {
      if (item.sep) {
        var sep = document.createElement('div');
        sep.className = 'sep';
        ctxmenu.appendChild(sep);
      } else {
        var b = document.createElement('button');
        var label = document.createElement('span');
        label.textContent = item.label;
        b.appendChild(label);
        if (item.key) {
          var key = document.createElement('span');
          key.className = 'key';
          key.textContent = item.key;
          b.appendChild(key);
        }
        if (item.danger) b.classList.add('danger');
        b.addEventListener('click', function () { hideMenu(); item.action(); });
        ctxmenu.appendChild(b);
      }
    })(items[i]);
  }
  ctxmenu.classList.remove('hidden');
  var r = ctxmenu.getBoundingClientRect();
  ctxmenu.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
  ctxmenu.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
  var first = ctxmenu.querySelector('button');
  if (first) first.focus();
}
ctxmenu.addEventListener('keydown', function (e) {
  var buttons = Array.prototype.slice.call(ctxmenu.querySelectorAll('button'));
  if (!buttons.length) return;
  var at = buttons.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); buttons[(at + 1 + buttons.length) % buttons.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); buttons[(at - 1 + buttons.length) % buttons.length].focus(); }
  else if (e.key === 'Enter' && at >= 0) { e.preventDefault(); buttons[at].click(); }
  else if (e.key === 'Escape') { e.preventDefault(); hideMenu(); cm.focus(); }
});
function nodeMenu(node) {
  var items = [];
  var projectFile = /\\.csayproj$/i.test(node.name);
  if (node.dir) {
    items.push(menuItem('新建文件', function () { newFile(node.path); }));
    items.push(menuItem('新建文件夹', function () { newFolder(node.path); }));
    items.push(menuItem('打开此文件夹', function () { loadTree(node.path); }));
    items.push(menuSep());
    items.push(menuItem('重命名', function () { renameNode(node); }));
    items.push(menuItem('删除', function () { deleteNode(node); }, true));
    items.push(menuSep());
    items.push(menuItem('复制路径', function () { copyPath(node); }));
    items.push(menuItem('在资源管理器中显示', function () { revealNode(node); }));
  } else if (projectFile) {
    items.push(menuItem('编辑项目设置', editProject));
    items.push(menuItem('打包项目', packageProject));
    items.push(menuSep());
    items.push(menuItem('复制路径', function () { copyPath(node); }));
    items.push(menuItem('在资源管理器中显示', function () { revealNode(node); }));
  } else {
    items.push(menuItem('打开', function () { openPath(node.path); }));
    items.push(menuItem('运行', function () { openPath(node.path).then(doRun); }, false, 'Ctrl+Enter'));
    items.push(menuItem('设为项目入口', function () { setProjectEntry(node.path); }));
    items.push(menuSep());
    items.push(menuItem('新建同级文件', function () { newFile(parentPath(node.path)); }));
    items.push(menuItem('重命名', function () { renameNode(node); }));
    items.push(menuItem('删除', function () { deleteNode(node); }, true));
    items.push(menuSep());
    items.push(menuItem('复制路径', function () { copyPath(node); }));
    items.push(menuItem('在资源管理器中显示', function () { revealNode(node); }));
  }
  return items;
}
function blankMenu() {
  return [
    menuItem('新建文件', function () { newFile(TREE_ROOT); }),
    menuItem('新建文件夹', function () { newFolder(TREE_ROOT); }),
    menuItem('打开文件', openFileDialog),
    menuItem('打开文件夹', openFolder),
    menuSep(),
    menuItem('项目设置', editProject),
    menuItem('打包项目', packageProject),
    menuSep(),
    menuItem('刷新', function () { if (TREE_ROOT) loadTree(TREE_ROOT); })
  ];
}
function tabMenu(t) {
  return [
    menuItem('关闭', function () { closeTab(TABS.indexOf(t)); }),
    menuItem('关闭其他', function () { TABS = [t]; ACTIVE = -1; activate(0); }),
    menuSep(),
    menuItem('复制路径', function () { copyPath({ path: t.path }); })
  ];
}

function askText(title, label, value) {
  return new Promise(function (resolve) {
    modalResolve = resolve;
    modalInputMode = true;
    modalTitle.textContent = title;
    modalMsg.textContent = label || '';
    modalInput.value = value || '';
    modalInput.style.display = 'block';
    modal.classList.remove('hidden');
    setTimeout(function () { modalInput.focus(); modalInput.select(); }, 0);
  });
}
function askConfirm(title, message) {
  return new Promise(function (resolve) {
    modalResolve = resolve;
    modalInputMode = false;
    modalTitle.textContent = title;
    modalMsg.textContent = message || '';
    modalInput.style.display = 'none';
    modal.classList.remove('hidden');
    setTimeout(function () { document.getElementById('modalOk').focus(); }, 0);
  });
}
function finishModal(ok) {
  var resolve = modalResolve;
  modalResolve = null;
  modal.classList.add('hidden');
  if (!resolve) return;
  if (!ok) { resolve(modalInputMode ? null : false); return; }
  resolve(modalInputMode ? modalInput.value : true);
}
document.getElementById('modalCancel').addEventListener('click', function () { finishModal(false); });
document.getElementById('modalOk').addEventListener('click', function () { finishModal(true); });
modalInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); finishModal(true); }
  if (e.key === 'Escape') { e.preventDefault(); finishModal(false); }
});
modal.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { e.preventDefault(); finishModal(false); }
});

function symbolRequest(kind, pos) {
  var t = current();
  if (!t) return;
  var url = kind === 'references' ? '/api/references' : '/api/definition';
  var body = {
    file: t.path,
    text: cm.getValue(),
    line: pos.line + 1,
    col: pos.ch + 1,
    workspace: WORKSPACE || TREE_ROOT || ''
  };
  setStatus(kind === 'references' ? '查找引用…' : '查找定义…');
  fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) { setStatus(d.error, 'err'); return; }
      if (kind === 'references') {
        showReferences(d);
        return;
      }
      if (!d.found || !d.definition) {
        setStatus('没有找到「' + (d.name || '当前名字') + '」的定义', 'err');
        return;
      }
      openLocation(d.definition.file, d.definition.line, d.definition.col);
    })
    .catch(function (e) { setStatus('符号查找失败：' + e, 'err'); });
}
function cursorWord() {
  var c = cm.getCursor();
  var line = cm.getLine(c.line) || '';
  function isWord(ch) { return /[A-Za-z0-9_\u4e00-\u9fa5]/.test(ch || ''); }
  var start = c.ch;
  if (start > 0 && !isWord(line.charAt(start))) start--;
  if (!isWord(line.charAt(start))) return '';
  while (start > 0 && isWord(line.charAt(start - 1))) start--;
  var end = start;
  while (end < line.length && isWord(line.charAt(end))) end++;
  return line.slice(start, end);
}
function editorMenu(pos) {
  var word = cursorWord();
  var items = [];
  if (word) {
    items.push(menuItem('转到定义', function () { symbolRequest('definition', pos); }, false, 'F12'));
    items.push(menuItem('查找引用', function () { symbolRequest('references', pos); }, false, 'Shift+F12'));
    items.push(menuSep());
  }
  items.push(menuItem('撤销', function () { cm.undo(); }, false, 'Ctrl+Z'));
  items.push(menuItem('重做', function () { cm.redo(); }, false, 'Ctrl+Y'));
  items.push(menuSep());
  items.push(menuItem('剪切', function () { cm.execCommand('cut'); }, false, 'Ctrl+X'));
  items.push(menuItem('复制', function () { cm.execCommand('copy'); }, false, 'Ctrl+C'));
  items.push(menuItem('粘贴', function () { cm.execCommand('paste'); }, false, 'Ctrl+V'));
  items.push(menuItem('全选', function () { cm.execCommand('selectAll'); }, false, 'Ctrl+A'));
  items.push(menuSep());
  items.push(menuItem('保存', function () { doSave(false); }, false, 'Ctrl+S'));
  items.push(menuItem('运行', doRun, false, 'Ctrl+Enter'));
  return items;
}

document.getElementById('btnSave').addEventListener('click', function () { doSave(false); });
document.getElementById('btnRun').addEventListener('click', doRun);
document.getElementById('btnProject').addEventListener('click', editProject);
document.getElementById('btnPackage').addEventListener('click', packageProject);
document.getElementById('projCancel').addEventListener('click', closeProjectDialog);
document.getElementById('projSave').addEventListener('click', saveProjectForm);
document.getElementById('projPick').addEventListener('click', chooseProjectEntry);
projectModal.addEventListener('click', function (e) { if (e.target === projectModal) closeProjectDialog(); });
projectModal.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); saveProjectForm(); }
  if (e.key === 'Escape') { e.preventDefault(); closeProjectDialog(); }
});
document.getElementById('btnDocs').addEventListener('click', function () { window.open('/docs'); });
document.getElementById('projectInfo').addEventListener('click', editProject);
document.getElementById('filter').addEventListener('input', function (e) { FILTER = e.target.value.trim(); renderTree(); });
document.getElementById('tab-p').addEventListener('click', function () { tab('p'); });
document.getElementById('tab-o').addEventListener('click', function () { tab('o'); });
document.getElementById('tab-r').addEventListener('click', function () { tab('r'); });

treeEl.addEventListener('contextmenu', function (e) {
  e.preventDefault(); e.stopPropagation();
  SELECTED = null; selectNode(null);
  showMenu(e.clientX, e.clientY, blankMenu());
});
cmhost.addEventListener('contextmenu', function (e) {
  e.preventDefault();
  e.stopPropagation();
  var pos = cm.coordsChar({ left: e.clientX, top: e.clientY }, 'window');
  var index = cm.indexFromPos(pos);
  var keep = false;
  var ranges = cm.listSelections();
  for (var i = 0; i < ranges.length; i++) {
    if (index >= cm.indexFromPos(ranges[i].anchor) && index <= cm.indexFromPos(ranges[i].head)) { keep = true; break; }
    if (index >= cm.indexFromPos(ranges[i].head) && index <= cm.indexFromPos(ranges[i].anchor)) { keep = true; break; }
  }
  if (!keep) cm.setCursor(pos);
  cm.focus();
  showMenu(e.clientX, e.clientY, editorMenu(pos));
}, true);
document.addEventListener('click', hideMenu);
document.addEventListener('scroll', hideMenu, true);
window.addEventListener('resize', hideMenu);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideMenu(); });

cm.on('change', function () {
  if (loading) return;
  var t = current();
  if (t) { t.content = cm.getValue(); t.dirty = true; renderTabs(); }
  scheduleCheck();
  updateCursor();
});
cm.on('cursorActivity', updateCursor);
cm.setOption('extraKeys', {
  'Ctrl-S': function () { doSave(false); },
  'Ctrl-Enter': function () { doRun(); },
  'F5': function () { doRun(); },
  'Ctrl-N': function () { newFile(); },
  'Ctrl-O': function () { openFolder(); },
  'Ctrl-W': function () { if (ACTIVE >= 0) closeTab(ACTIVE); },
  'Ctrl-/': function () { cm.execCommand('toggleComment'); },
  'Ctrl-Space': function () { showCsayHint(cm); },
  'F12': function () { symbolRequest('definition', cm.getCursor()); },
  'Shift-F12': function () { symbolRequest('references', cm.getCursor()); },
  'F1': function () { window.open('/docs'); },
  'Tab': function (editor) {
    if (editor.somethingSelected()) editor.execCommand('indentMore');
    else editor.replaceSelection('    ', 'end');
  },
  'Shift-Tab': function (editor) { editor.execCommand('indentLess'); }
});

window.addEventListener('beforeunload', function (e) {
  for (var i = 0; i < TABS.length; i++) if (TABS[i].dirty) { e.preventDefault(); e.returnValue = ''; return; }
});

var initial = new URLSearchParams(location.search).get('file') || '';
if (!initial) {
  updateTitle();
  loadTree('');
} else {
  fetch('/api/load?file=' + encodeURIComponent(initial))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.error) { setStatus(d.error, 'err'); loadTree(''); return; }
      WORKSPACE = d.dir;
      TREE_ROOT = d.dir;
      addTab(d);
      loadTree(d.dir);
    })
    .catch(function (e) { setStatus('编辑器初始化失败：' + e, 'err'); });
}
